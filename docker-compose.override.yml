# Solo desarrollo: docker compose lo combina solo con docker-compose.yml.
# Habilita el autoreload de uvicorn para que `docker compose watch` (develop.watch)
# refleje los cambios de código sin reconstruir la imagen.
# Para correr sin esto (modo producción): docker compose -f docker-compose.yml up
services:
  app:
    command:
      - uvicorn
      - presentation.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
